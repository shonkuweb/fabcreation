version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY:-AIzaSyAwlTiWsEmLeeeZMfap_azg0IfzeG9OB0g}
        - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-fab-creations-445e0.firebaseapp.com}
        - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-fab-creations-445e0}
        - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-fab-creations-445e0.firebasestorage.app}
        - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-225569715492}
        - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID:-1:225569715492:web:6ca4d1dfa1ce9528d0efb1}
    container_name: fab-creations-web
    restart: always
    ports:
      - "${HOST_PORT:-4050}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_DIR=/app/data
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-d098e896b8f7dc0403ad3a16f592dfe6}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-chf-media}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-989af8ef35b94b6abf46b295af3c50d3}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-a8000cd7a60e056098ec04e0580328bbf21fff4f0da6126075cc3ed05f79ab95}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-https://pub-ce8688bc6c654bcfb99716f7c9373bcd.r2.dev}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin@fab2026}
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY:-AIzaSyAwlTiWsEmLeeeZMfap_azg0IfzeG9OB0g}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-fab-creations-445e0.firebaseapp.com}
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-fab-creations-445e0}
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-fab-creations-445e0.firebasestorage.app}
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-225569715492}
      - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID:-1:225569715492:web:6ca4d1dfa1ce9528d0efb1}
    volumes:
      # Persistent host mount for database data (products, categories, orders)
      - ./data:/app/data
